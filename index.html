<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Movie Finder</title>
  </head>
  <body>
    <div class="header">
      <div class="logo"></div>
      <span>Movie Finder</span>
    </div>

    <div class="main">
      <div class="overlay">
        <div class="search">
          <input
            type="text"
            placeholder="Search Movie Name Here"
            name="search"
            class="search-bar"
            id="search_bar"
          />
          <button class="btn" id="submit">Search</button>
        </div>
      </div>
    </div>

    <div class="info">
      <div class="poster">
        <img id="img" src="assets/back.jpg" alt="poster" />
      </div>
      <div class="info-content">
        <div class="info-content-main">
          <ul>
            <li>Title:- <span id="title"></span></li>
            <li>Year:- <span id="year"></span></li>
            <li>Actors:- <span id="actors"></span></li>
            <li>Box Office:- <span id="box-office"></span></li>
            <li>Country:- <span id="country"></span></li>
            <li>Director:- <span id="director"></span></li>
            <li>Writer:- <span id="writer"></span></li>
            <li>Genre:- <span id="genre"></span></li>
            <li>Language:- <span id="lang"></span></li>
            <li>Plot:- <span id="plot"></span></li>
            <li>Rating:-<span id="rating"></span></li>
          </ul>
        </div>
      </div>
    </div>

    <div class="footer">
      Created By :-
      <u
        ><a href="https://github.com/Dhruv1159" target="_blank"
          >Dhruv Saini</a
        ></u
      >
    </div>

    <script src="index.js"></script>
  </body>
</html>
