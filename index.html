<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Movie Finder</title>
  </head>
  <body>
    <div class="header">
      <div class="logo"></div>
      <span>Movie Finder</span>
    </div>

    <div class="main">
      <div class="overlay">
        <div class="search">
          <input
            type="text"
            placeholder="Search Movie Name Here"
            name="search"
            class="search-bar"
          />
          <button class="btn">Search</button>
        </div>
      </div>
    </div>
  </body>
</html>
